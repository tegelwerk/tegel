id: https://w3id.org/tegel/toy/record
name: toy_record
version: "2"
slots:
  sample_name:
    range: string
  uuid:
    range: string
  recorded:
    range: string
  channel:
    range: string
  calibrated:
    range: boolean
classes:
  Timestamped:
    mixin: true
    slots:
      - recorded
  Record:
    tree_root: true
    mixins:
      - Timestamped
    slots:
      - sample_name
      - uuid
      - channel
      - calibrated
