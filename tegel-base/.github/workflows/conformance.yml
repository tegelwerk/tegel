name: conformance

on:
  workflow_call:

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tegel-base
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/integration examples/toy/tests
